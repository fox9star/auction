name: Update Auction Data and Deploy

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 00:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 지원

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl

      - name: Rebuild Auction Portal
        run: |
          python build_portal.py

      - name: Commit and Push Changes if Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(auto): 대법원 법원경매 최신 데이터 정기 자동 갱신"
            git push
          fi
