  function parseCriteria(q) {

      if (/^\s*원?\s*(이상|초과|넘|부터|보다\s*(비싼|높|큰|비싸))/.test(after)) type = 'min';

  function applyCriteria(list, c) {

  function describe(c) {

  function findRefs(q) {
    var refs = [], m, re;
    re = /(\d{4})\s*타경\s*(\d+)/g;
    while ((m = re.exec(q)) !== null) {
      var cn = m[1] + '타경' + m[2];
      DATA.forEach(function (d) { if (d.case_no === cn && refs.indexOf(d) < 0) refs.push(d); });
    }
    re = /(\d+)\s*번(?!지|길|째\s*줄)/g;
    while ((m = re.exec(q)) !== null) { var it = S.all[parseInt(m[1], 10) - 1]; if (it && refs.indexOf(it) < 0) refs.push(it); }
    var regPrefix = '대전 ';
    if (/수도권/.test(q)) regPrefix = '수도권 ';
    else if (/부울경/.test(q)) regPrefix = '부울경 ';
    else if (/대경/.test(q)) regPrefix = '대경권 ';
    else if (/영남/.test(q)) regPrefix = '영남권 ';
    else if (/충청/.test(q)) regPrefix = '충청권 ';
    else if (/호남/.test(q)) regPrefix = '호남권 ';
    else if (/강원|제주/.test(q)) regPrefix = '강원·제주 ';
    else if (/전국/.test(q)) regPrefix = '전국 베스트 ';
    re = /(\d+)\s*위/g;
    while ((m = re.exec(q)) !== null) {
      var label = regPrefix + m[1] + (regPrefix === '전국 베스트 ' ? '' : '위');
      var hit = DATA.filter(function (d) { return d.rank === label || d.rank === (regPrefix + m[1] + '위'); })[0];
      if (hit && refs.indexOf(hit) < 0) refs.push(hit);
    }
    return refs;
  }

  function searchReply(q, base, c, refine) {
    var res = applyCriteria(base, c);

      var chips = ['대전 TOP 5', '할인율 높은 순 5개'];

  function showSlice(n, head) {
    var res = S.all, from = S.shown, to = Math.min(from + n, res.length);

  function findSimilarItems(it, count) {
    var u0 = String(it.usage).split(',')[0];
    return DATA.filter(function (d) { return d.id !== it.id; }).map(function (d) {
      var s = 0;
      if (d.sigu && d.sigu === it.sigu) s += 40;
      else if (d.sido === it.sido) s += 25;
      if (String(d.usage).indexOf(u0) >= 0) s += 30;
      var ratio = Math.abs(d.min_price - it.min_price) / Math.max(it.min_price, 1);
      s += Math.max(0, 20 - ratio * 20);
      return { d: d, s: s };
    }).sort(function (a, b) { return b.s - a.s; }).slice(0, count || 2).map(function (x) { return x.d; });
  }

  function answerForItem(it, q, fromRoute) {
    if (!it) return fromRoute ? null : route(q);
    S.focusItem = it;
    var c = parseCriteria(q);
    var otherRefs = findRefs(q).filter(function (d) { return d.id !== it.id; });
    var sp = parseSpecInfo(it);

    // 1. 비교 요청
    if (/비교|vs|유사|비슷|주변\s*매물|다른\s*물건/i.test(q)) {
      var targets = otherRefs.length ? [it].concat(otherRefs.slice(0, 2)) : [it].concat(findSimilarItems(it, 2));
      return compareReply(targets);

      var price = c.maxPrice != null ? c.maxPrice : c.minPrice;

      return reply(calcHtml(price, null, usage, won(price) + ' 낙찰 가정'), ['취득세 알려줘', '안전마진 계산법'], null, 'calc');
    }

    if (/통계|평균|현황|분포|몇\s*(건|개)|총\s*몇|요약|개수/.test(q)) {
      var base0 = /그중|그\s*중|이\s*중|여기서/.test(q) && S.all.length ? S.all : DATA;
      return statsReply(c.has ? applyCriteria(base0, c) : base0, c);
    }

    var searchVerb = /추천|찾아|보여|골라|리스트|매물\s*검색|물건\s*검색/.test(q);
    var advReply = expertConsultantReply(q);
    if (advReply && !searchVerb) {
      return advReply;
    }

    kb = findKB(q);
    var isQuestion = /뭐|무엇|란\??\s*$|이란|라는|의미|설명|뜻|어떻게|왜|차이|궁금|어디|인가요|인가\??|할까|말까|좋은|괜찮|제외|포기|피해|위험|\?/.test(q);
    if (kb.length && !searchVerb && (isQuestion || !c.has)) {
      var e = kb[0], chips = (e.rel || []).slice();
      if (e.act) chips.unshift(e.act);
      kb.slice(1, 3).forEach(function (x) { chips.push(x.t.replace(/^[^\s]+\s/, '').replace(/\s*\(.*\)$/, '')); });
      return reply(enhanceKBWithIntent(q, e), chips, null, 'kb');

    if (c.has || searchVerb || c.sort || c.limit) {

      return searchReply(q, refine ? S.all.slice() : DATA, c, refine);
    }
    if (kb.length) { var e2 = kb[0]; return reply(enhanceKBWithIntent(q, e2), (e2.rel || []).slice(), null, 'kb'); }

    return smartFallbackReply(q);
  }

  function ls(k, v) {

    var out = [], inList = false;
    h.split('\n').forEach(function (ln) {
      var mm = ln.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
      if (mm) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + mm[1] + '</li>'); }
      else { if (inList) { out.push('</ul>'); inList = false; } if (ln.trim()) out.push(/^<h5>/.test(ln) ? ln : '<p>' + ln + '</p>'); }
    });
    if (inList) out.push('</ul>');
    return out.join('').replace(/(\d{4})타경(\d+)/g, function (cn) {
      var it = DATA.filter(function (d) { return d.case_no === cn; })[0];

    var sys = '당신은 대한민국 법원 부동산 경매 전문 상담 AI입니다. 오늘 날짜는 ' + fmtDate(TODAY) + '입니다.\n' +
      '- 물건 추천·언급은 반드시 아래 [포털 데이터]에 있는 물건만 근거로 하고, 데이터에 없는 시세·사실은 지어내지 마세요.\n' +

      '- 매각기일이 오늘 이전인 물건은 "기일 경과(변경 여부 확인 필요)"라고 알려주세요.\n' +
      '- 권리 "안전" 표기는 법원 공고 비고란 키워드 기준의 1차 선별일 뿐이므로, 등기부·매각물건명세서 확인을 권고하세요.\n' +
      '- 법률·세무 내용은 일반 정보로 제공하고 전문가 확인을 권하세요. 한국어로 간결하게, 마크다운 목록을 활용하세요.\n\n' +

    var userText = q + (local && local.intent !== 'fallback' ? '\n\n[참고: 포털 로컬 엔진 1차 결과]\n' + cut(local.text, 1500) : '');

    if (e.key === 'Escape' && panel.classList.contains('open') && !document.querySelector('.modal-backdrop.show')) toggle(false);
  });

  loadSettings(); renderSuggest(); resetChat();
  window.cbAsk = function (q) { toggle(true); send(q); };
  window.cbSetFocusItem = function (id) {
    var it = DATA.filter(function (d) { return d.id === id; })[0];
    if (it) S.focusItem = it;
  };
  window.cbOpenFromModal = function (id, q) {
    var it = DATA.filter(function (d) { return d.id === id; })[0] || S.focusItem;
    if (typeof closeModal === 'function') closeModal();
    toggle(true);
    if (it) {
      S.focusItem = it;
      send(q || (it.rank + ' 자세히'));
    } else if (q) {
      send(q);
    }
  };
  var modalLogsById = {};

  window.cbInitModalChat = function (id, forceReset) {
    var it = DATA.filter(function (d) { return d.id === id; })[0] || S.focusItem;
    var logEl = document.getElementById('modal-chat-log');
    if (!it || !logEl) return;
    S.focusItem = it;
    if (!forceReset && modalLogsById[it.id]) {
      logEl.innerHTML = modalLogsById[it.id];
      logEl.scrollTop = logEl.scrollHeight;
      return;
    }
    var welcomeEl = document.createElement('div');
    welcomeEl.className = 'cb-msg cb-bot';
    welcomeEl.innerHTML = buildModalWelcomeHtml(it);
    logEl.innerHTML = '';
    logEl.appendChild(welcomeEl);
    modalLogsById[it.id] = logEl.innerHTML;
  };

  window.cbToggleModalChatExpand = function () {
    var winEl = document.getElementById('modal-chat-window');
    var btnEl = document.getElementById('modal-chat-expand-btn');
    if (!winEl) return;
    var exp = winEl.classList.toggle('expanded');
    if (btnEl) {
      btnEl.textContent = exp ? '⤡ 대화창 축소' : '⤢ 대화창 확대';
    }
    var logEl = document.getElementById('modal-chat-log');
    if (logEl) logEl.scrollTop = logEl.scrollHeight;
  };

  window.cbAskInModal = function (id, q) {
    var it = DATA.filter(function (d) { return d.id === id; })[0] || S.focusItem;
    var inputEl = document.getElementById('modal-chat-input');
    var logEl = document.getElementById('modal-chat-log');
    var query = String(q != null ? q : (inputEl ? inputEl.value : '')).trim();
    if (!query || !logEl) return;
    if (inputEl && q == null) inputEl.value = '';
    logEl.classList.add('has-msg');

    var uEl = document.createElement('div');
    uEl.className = 'cb-msg cb-user';
    uEl.textContent = query;
    logEl.appendChild(uEl);

    var res = it ? answerForItem(it, query, false) : route(query);
    if (aiEnabled() && it) {
      var waitEl = document.createElement('div');
      waitEl.className = 'cb-msg cb-bot';
      waitEl.innerHTML = '<span class="cb-typing"><span></span><span></span><span></span></span>';
      logEl.appendChild(waitEl);
      logEl.scrollTop = logEl.scrollHeight;
      var promptWithItem = '[오직 다음 단일 경매물건에 대해서만 집중적으로 답변하세요: ' + itemText(it) + '] 사용자 질문: ' + query;
      askAI(promptWithItem, res).then(function (ans) {
        waitEl.innerHTML = md(ans) + '<div class="cb-note">🤖 생성형 AI 답변 · 중요한 판단은 원문 자료로 재확인하세요.</div>';
        pushHist(promptWithItem, ans);
        modalLogsById[it.id] = logEl.innerHTML;
        logEl.scrollTop = logEl.scrollHeight;
      }).catch(function (err) {
        waitEl.innerHTML = '<p>⚠️ AI 호출 실패: ' + esc(err.message) + '</p>' + res.html;
        modalLogsById[it.id] = logEl.innerHTML;
      });
      return;
    }

    var bEl = document.createElement('div');
    bEl.className = 'cb-msg cb-bot';
    var chipsHtml = (res.chips || []).map(function (ch) {
      if (typeof ch === 'string') {
        return '<button type="button" class="cb-chip" onclick="cbAskInModal(\'' + esc(it ? it.id : '') + '\', \'' + esc(ch) + '\')">' + esc(ch) + '</button>';
      }
      if (ch.act === 'open' && ch.arg) {
        return '<button type="button" class="cb-chip" onclick="openDetail(\'' + esc(ch.arg) + '\')">' + esc(ch.label) + '</button>';
      }
      return '';
    }).join('');
    bEl.innerHTML = res.html + (chipsHtml ? '<div class="cb-actions">' + chipsHtml + '</div>' : '');
    logEl.appendChild(bEl);
    if (it) modalLogsById[it.id] = logEl.innerHTML;
    logEl.scrollTop = logEl.scrollHeight;
  };

  window.cbReloadItems = function (newData) {
    if (Array.isArray(newData)) {
      DATA = newData;
    }
  };
})();
</script>
